<title>Galeri — onaylı referans</title>
<!-- ONAYLI TASARIM (Galeri). Görünümü ve hareket değerlerini DEĞİŞTİRME.
     Navbar, maskot, mobil menü ve footer: sitenin ortak olanları kullanılacak (buradakiler yer tutucu).
     Karo duvar kodu karo-duvar.js (anasayfa ile ortak). İmleç: imlec/imlec.svg ve imlec/imlec-el.svg. -->
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bungee&family=VT323&family=Mrs+Saint+Delafield&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html{background:#140629}
body{margin:0;color:#FFF3DD;font-family:"Space Grotesk",system-ui,sans-serif}
body.bg-acik{overflow:hidden}
[hidden]{display:none!important}
/* SİTE GENELİ İMLEÇ (bütün sayfalara) */
html,body{cursor:url(imlec/imlec.svg) 16 16,auto}
a,button,[role=button],label,select,summary{cursor:url(imlec/imlec-el.svg) 16 16,pointer}
a:focus-visible,button:focus-visible{outline:3px solid #7FE7FF;outline-offset:3px}
@keyframes flick{0%,100%{opacity:1}12%{opacity:.25}17%{opacity:1}46%{opacity:.85}52%{opacity:.15}58%{opacity:1}83%{opacity:.4}88%{opacity:1}}
@keyframes swayG{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes swayG2{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-14deg)}}
.gt{font-family:"Abril Fatface",Didot,Georgia,serif;font-weight:400;background:linear-gradient(180deg,#FFF6D6 10%,#FFC24B 50%,#FF5A6E 95%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #3A0B52) drop-shadow(0 0 22px rgba(255,170,80,.45))}
.lb{font-family:Bungee,Impact,sans-serif;letter-spacing:6px;color:#FFE7C2;text-shadow:0 0 16px rgba(255,120,160,.7)}
.ust-bar{position:fixed;z-index:30;top:18px;left:40px;right:40px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 22px;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(10,0,40,.45)}
.ust-bar nav{display:flex;gap:28px;font-weight:500;font-size:15px}.ust-bar a{color:#FFF3DD;text-decoration:none}
@media (max-width:760px){.ust-bar{left:12px;right:12px}.ust-bar nav{display:none}}
#galeri{position:relative;overflow:hidden;background:radial-gradient(ellipse 80% 40% at 50% 0%,#5B1E6E 0%,#2A0D45 50%,#140629 100%)}
.g-ust{position:relative;max-width:1180px;margin:0 auto;padding:230px 32px 60px;display:flex;flex-direction:column;align-items:center;gap:26px}
.g-ust h1{margin:0;font-size:96px;line-height:1}
.g-ust p{margin:0;max-width:520px;text-align:center;font-size:17px;line-height:1.6;color:#E3D2F4}
#galeri-duvar{width:100%;max-width:1100px;margin-top:30px}
@media (max-width:760px){.g-ust{padding:150px 14px 40px;gap:16px}.g-ust h1{font-size:62px}.g-ust p{font-size:15px}#galeri-duvar{margin-top:10px}}
/* büyük görünüm */
#bg-perde{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 45%,rgba(42,13,69,.75),rgba(8,2,18,.95))}
#bg{position:fixed;left:50%;top:50%;z-index:41;width:min(760px,86vw);display:flex;flex-direction:column;align-items:center;gap:18px;transform:translate(-50%,-50%)}
.bg-cerceve{position:relative;width:100%;aspect-ratio:4 / 3;max-height:68vh;padding:10px;box-sizing:border-box;border-radius:14px;background:linear-gradient(160deg,#FFF1B8,#C98A2B 45%,#FFE7A3 70%,#8A5A14);box-shadow:0 0 60px rgba(255,180,90,.35),0 40px 80px rgba(5,0,20,.7)}
#bg-resim{width:100%;height:100%;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
#bg-resim img{width:100%;height:100%;object-fit:contain;display:block;background:#140629}
.bg-ampul{position:absolute;inset:-22px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.bg-ampul div{display:flex;justify-content:space-between;padding:0 8px}
.bg-ampul span{width:9px;height:9px;border-radius:50%;background:#FFE7A3;box-shadow:0 0 10px 3px #FFB84D;animation-name:flick;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.bg-alt{display:flex;align-items:center;gap:22px;width:100%;justify-content:space-between}
.bg-bilgi{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
#bg-sayac{font-family:VT323,monospace;font-size:22px;color:#FFD36B;letter-spacing:2px}
#bg-aciklama{font-size:17px;color:#F1E4FF}
.okbtn{flex:none;width:56px;height:56px;border-radius:50%;color:#FFF3DD;font-size:22px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(255,255,255,.06) 60%);border:1px solid rgba(255,231,194,.5);backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(5,0,20,.5)}
#bg-kapat{position:absolute;right:-14px;top:-62px;padding:8px 16px;border-radius:999px;color:#FFE7C2;font-weight:700;background:rgba(20,6,41,.7);border:1px solid rgba(255,231,194,.5);font-family:inherit;font-size:15px}
@media (max-width:760px){#bg{width:94vw}#bg-kapat{right:0;top:-54px}.okbtn{width:48px;height:48px}}
@media (prefers-reduced-motion:reduce){#galeri *,.bg-ampul span{animation:none!important}}
/* footer yer tutucu — sitenin ortak imzalı footer'ı kullanılacak */
.alt{min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#2A0D57,#140629)}
.alt p{margin:0}
</style>

(function () {
  var CSS = '' +
    '.kd-karo{position:absolute;aspect-ratio:1;padding:0;border:0;background:none;transition:transform 1.1s cubic-bezier(.22,1,.36,1)}' +
    '.kd-yuz{position:absolute;inset:0;border-radius:5px;overflow:hidden;transition:box-shadow 1.1s ease}' +
    '.kd-yuz img{position:absolute;left:50%;top:50%;width:142%;height:142%;object-fit:cover;transform:translate(-50%,-50%) rotate(-45deg)}' +
    '.kd-yuz .kd-yer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:rotate(-45deg);font-size:13px;font-weight:700;color:#FFF3DD}' +
    '.kd-yildiz{position:absolute;aspect-ratio:1;z-index:0;pointer-events:none;translate:-50% -50%;transition:left 1.1s cubic-bezier(.22,1,.36,1),top 1.1s cubic-bezier(.22,1,.36,1)}' +
    '.kd-yildiz>span,.kd-yildiz>span>span{display:block;width:100%;height:100%}' +
    '.kd-yildiz svg{display:block;width:100%;height:100%}' +
    '@keyframes kdSuzul1{0%,100%{transform:translate(0,0)}25%{transform:translate(7px,-9px)}50%{transform:translate(-5px,-4px)}75%{transform:translate(4px,8px)}}' +
    '@keyframes kdSuzul2{0%,100%{transform:translate(0,0)}30%{transform:translate(-8px,6px)}60%{transform:translate(6px,9px)}85%{transform:translate(-3px,-7px)}}' +
    '@keyframes kdSuzul3{0%,100%{transform:translate(0,0)}20%{transform:translate(5px,7px)}55%{transform:translate(-9px,-3px)}80%{transform:translate(3px,-8px)}}' +
    '@keyframes kdPirilti{0%,100%{transform:scale(.35) rotate(0deg);opacity:.25}45%{transform:scale(1) rotate(45deg);opacity:1}60%{transform:scale(.8) rotate(60deg);opacity:.85}}' +
    '@media (prefers-reduced-motion:reduce){.kd-karo,.kd-yildiz{transition:none}.kd-yildiz *{animation:none!important}}';
  if (!document.getElementById('kd-stil')) { var st = document.createElement('style'); st.id = 'kd-stil'; st.textContent = CSS; document.head.appendChild(st); }
  var R = [0.37, 0.91, 0.12, 0.66, 0.48, 0.83, 0.05, 0.72, 0.29, 0.58, 0.94, 0.21, 0.77, 0.43];
  var YILDIZ = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0 C10.8 6.2 13.8 9.2 20 10 C13.8 10.8 10.8 13.8 10 20 C9.2 13.8 6.2 10.8 0 10 C6.2 9.2 9.2 6.2 10 0 Z" fill="RENK"/></svg>';
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  window.KaroDuvar = function (kutu, o) {
    var F = o.fotolar, N = F.length, D = o.adim, KOS = o.kosegen, KENAR = KOS / Math.SQRT2, XM = o.xMax;
    var y = o.yildiz || {};
    kutu.style.position = 'relative'; kutu.style.containerType = 'inline-size';
    // baklava kafes: satır r=0 en altta; çift satırlarda x tam sayı, tek satırlarda yarım
    var yuva = [];
    for (var r = 0; r < 40; r++) for (var x = -XM; x <= XM + 1e-9; x += 0.5) if ((Math.abs(Math.round(x * 2)) % 2 === 0) === (r % 2 === 0)) yuva.push({ r: r, x: x, d: Math.hypot(x, r / 2) });
    yuva.sort(function (a, b) { return a.d - b.d || a.r - b.r || a.x - b.x; });
    var ust = Math.max.apply(null, yuva.slice(0, N).map(function (q) { return q.r; }));
    var H = KOS + 12 + ust * D / 2 * 1.05 + 10;
    kutu.style.aspectRatio = '1 / ' + (H / 100).toFixed(3);
    var taban = yuva.slice(0, N).map(function (q) { return { cx: 50 + q.x * D, cy: H - KOS / 2 - 6 - q.r * D / 2 * 1.05 }; });
    // camgöz: ortadakiler büyük ve öne çıkık, aralar açılır
    var ox = 0, oy = 0; taban.forEach(function (q) { ox += q.cx / N; oy += q.cy / N; });
    var dmax = Math.max.apply(null, taban.map(function (q) { return Math.hypot(q.cx - ox, q.cy - oy); })) || 1;
    var yer = taban.map(function (q) {
      var vx = q.cx - ox, vy = q.cy - oy, u = Math.hypot(vx, vy) / dmax, b = 1 + 0.16 * (1 - u);
      return { cx: ox + vx * b, cy: oy + vy * b, mercek: 1.22 - 0.34 * u };
    });
    // karolar
    var karolar = F.map(function (f, i) {

      b.type = 'button'; b.className = 'kd-karo'; b.setAttribute('aria-label', (f.alt || ('Fotoğraf ' + (i + 1))) + ' — büyüt');
      b.style.left = (q.cx - KENAR / 2).toFixed(2) + '%'; b.style.top = ((q.cy - KENAR / 2) / H * 100).toFixed(2) + '%'; b.style.width = KENAR.toFixed(2) + '%';
      b.innerHTML = '<span class="kd-yuz" style="background:' + (f.renk || '#3A1260') + '">' +
        (f.src ? '<img src="' + esc(f.src) + '" alt="" loading="lazy">' : '<span class="kd-yer">[FOTO ' + (i + 1) + ']</span>') + '</span>';
      kutu.appendChild(b); return b;
    });
    // parıltılar: yan yana karoların köşe buluşması (büyük) ve çapraz komşuların arası (küçük)
    var yildizlar = [];
    for (var i = 0; i < N; i++) for (var j = i + 1; j < N; j++) {
      var a = taban[i], c = taban[j], dx = Math.abs(a.cx - c.cx), dy = Math.abs(a.cy - c.cy);
      var yatay = Math.abs(dx - D) < 0.5 && dy < 0.5, capraz = Math.abs(dx - D / 2) < 0.5 && Math.abs(dy - D / 2 * 1.05) < 0.5;
      if (!yatay && !capraz) continue;

      s.className = 'kd-yildiz'; s.setAttribute('aria-hidden', 'true');
      s.style.width = (yatay ? (y.boyutYatay || 2.6) : (y.boyutCapraz || 1.7)) + '%';
      s.innerHTML = '<span style="animation:kdSuzul' + (1 + k % 3) + ' ' + (5 + v * 5).toFixed(2) + 's ease-in-out infinite;animation-delay:' + (-R[(k * 5) % 14] * 4).toFixed(2) + 's">' +
        '<span style="animation:kdPirilti ' + (2.2 + v * 2.4).toFixed(2) + 's ease-in-out infinite;animation-delay:' + (-R[(k * 5) % 14] * 4).toFixed(2) + 's;filter:drop-shadow(0 0 6px ' + (y.parilti || 'rgba(255,220,140,.9)') + ')">' +
        YILDIZ.replace('RENK', y.renk || '#FFF3C4') + '</span></span>';
      kutu.insertBefore(s, kutu.firstChild);
      yildizlar.push({ el: s, i: i, j: j });
    }
    // imleçle büyüyen karo, diğerleri boşluğu koruyarak itilip küçülür; parıltılar karolarla birlikte kayar
    var secili = null, zt;
    function ciz() {
      var kay = yer.map(function (q, i) {
        var dx = 0, dy = 0, sc = q.mercek, z = q.mercek > 1.1 ? 2 : 1;
        if (secili !== null) {
          var o = yer[secili];
          if (i === secili) { sc = 1.5; z = 5; }
          else {
            var vx = q.cx - o.cx, vy = q.cy - o.cy, len = Math.hypot(vx, vy) || 1, it = 6 / Math.max(1, len / D);
            dx = vx / len * it; dy = vy / len * it; sc = q.mercek * (len < D * 1.1 ? 0.82 : 0.9);
          }
        }
        var b = karolar[i];
        b.style.zIndex = z;
        b.style.transform = 'translate(' + dx.toFixed(2) + 'cqw,' + dy.toFixed(2) + 'cqw) rotate(45deg) scale(' + sc + ')';
        b.firstChild.style.boxShadow = i === secili ? '0 40px 50px rgba(5,0,20,.7),0 0 40px rgba(255,190,110,.55)' : '0 12px 24px rgba(5,0,20,.45)';
        return { dx: dx, dy: dy };
      });
      yildizlar.forEach(function (s) {
        var mx = (yer[s.i].cx + kay[s.i].dx + yer[s.j].cx + kay[s.j].dx) / 2, my = (yer[s.i].cy + kay[s.i].dy + yer[s.j].cy + kay[s.j].dy) / 2;
        s.el.style.left = mx.toFixed(2) + '%'; s.el.style.top = (my / H * 100).toFixed(2) + '%';
      });
    }
    karolar.forEach(function (b, i) {
      var sec = function () { clearTimeout(zt); zt = setTimeout(function () { if (secili !== i) { secili = i; ciz(); } }, 120); };
      b.addEventListener('mouseenter', sec); b.addEventListener('focus', sec);
      b.addEventListener('click', function () { if (o.tikla) o.tikla(i, b); });
    });
    kutu.addEventListener('mouseleave', function () { clearTimeout(zt); secili = null; ciz(); });
    ciz();
    return { karolar: karolar };
  };
})();

<script>
(function () {
  /* Galeri fotoğrafları (ICERIK.md'den). İlk fotoğraf alt-ortaya gelir, sonrakiler dışa doğru dizilir; duvar kendiliğinden büyür. */
  var GALERI = [
    { src: '', alt: 'Fotoğraf 1', aciklama: '[Fotoğraf 1 açıklaması]', renk: 'linear-gradient(150deg,#3A1260,#C6306E)' },
    { src: '', alt: 'Fotoğraf 2', aciklama: '[Fotoğraf 2 açıklaması]', renk: 'linear-gradient(150deg,#FFC66B,#FF5A6E)' },

    { src: '', alt: 'Fotoğraf 4', aciklama: '[Fotoğraf 4 açıklaması]', renk: 'linear-gradient(150deg,#FF8A3D,#6A1B7A)' },
    { src: '', alt: 'Fotoğraf 5', aciklama: '[Fotoğraf 5 açıklaması]', renk: 'linear-gradient(150deg,#5B1E6E,#FFB0C8)' },
    { src: '', alt: 'Fotoğraf 6', aciklama: '[Fotoğraf 6 açıklaması]', renk: 'linear-gradient(150deg,#1E0838,#FF8A3D)' },
    { src: '', alt: 'Fotoğraf 7', aciklama: '[Fotoğraf 7 açıklaması]', renk: 'linear-gradient(150deg,#C6306E,#FFC66B)' },
    { src: '', alt: 'Fotoğraf 8', aciklama: '[Fotoğraf 8 açıklaması]', renk: 'linear-gradient(150deg,#0E3A6E,#FF5A8A)' },
    { src: '', alt: 'Fotoğraf 9', aciklama: '[Fotoğraf 9 açıklaması]', renk: 'linear-gradient(150deg,#6A1B7A,#FFC66B)' },
    { src: '', alt: 'Fotoğraf 10', aciklama: '[Fotoğraf 10 açıklaması]', renk: 'linear-gradient(150deg,#2A0D57,#FF9AB0)' }
  ];
  var $ = function (id) { return document.getElementById(id); };
  var az = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var N = GALERI.length, acik = false, su = 0, kaynak = null;

  var duvar = KaroDuvar($('galeri-duvar'), {
    fotolar: GALERI, adim: 20, kosegen: 16.8, xMax: 2,
    yildiz: { boyutYatay: 2.6, boyutCapraz: 1.7, renk: '#FFF3C4', parilti: 'rgba(255,220,140,.9)' },
    tikla: function (i, dugme) { ac(i, dugme); }

  function goster(i) {

  // Karo havaya kalkar: büyük görünüm tıklanan karonun yerinden 45° dönük ve küçük başlar, düzleşerek ortaya büyür
  function ac(i, dugme) {

    var tx = r.left + r.width / 2 - innerWidth / 2, ty = r.top + r.height / 2 - innerHeight / 2, s = Math.max(0.12, r.width / w);

  }
  function kapat() {

    bg.style.transform = 'translate(-50%,-50%) translate(' + tx + 'px,' + ty + 'px) rotate(45deg) scale(' + s + ')';

    }
  });
  var tx0 = null;

  });
  // galeri.html#foto-3 → o fotoğraf açık gelsin (anasayfadaki karodan gelince)
  var m = location.hash.match(/^#foto-(\d+)$/);
  if (m) { var k = +m[1] - 1; if (duvar.karolar[k]) setTimeout(function () { duvar.karolar[k].scrollIntoView({ block: 'center' }); setTimeout(function () { ac(k, duvar.karolar[k]); }, 350); }, 100); }
