<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projeler — onaylı referans</title>
<!-- ONAYLI TASARIM (Projeler). Görünümü ve hareket değerlerini DEĞİŞTİRME.
     Navbar, maskot, mobil menü ve footer: tr/index.html'deki ortak olanlar kullanılacak (buradakiler yer tutucu).
     Fontlar ileride assets/fonts'tan; font-family adları aynı kalacak. -->
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=VT323&family=Rubik+Beastly&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html{background:#140629}
body{margin:0;color:#FFF3DD;font-family:"Space Grotesk",system-ui,sans-serif}
body.detay-acik{overflow:hidden}
a{color:#FFF3DD}a:hover{color:#FFD36B}
@keyframes sway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes sway2{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-12deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes flick{0%,100%{opacity:1}12%{opacity:.3}17%{opacity:1}52%{opacity:.2}58%{opacity:1}}
@keyframes scan{from{background-position:0 0}to{background-position:0 6px}}
.px{font-family:"Pixelify Sans",VT323,monospace}
.vt{font-family:VT323,monospace}
.pxbtn{font-family:"Pixelify Sans",VT323,monospace;font-weight:700;cursor:pointer;border:0;color:#140629;background:linear-gradient(180deg,#FFE7A3,#FFC24B 55%,#E08A1E);box-shadow:inset 0 -4px 0 rgba(120,50,0,.45),inset 0 3px 0 rgba(255,255,255,.6),0 0 18px rgba(255,190,90,.45)}
.pxbtn:disabled{opacity:.45;cursor:not-allowed}
.pxbtn:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #7FE7FF;outline-offset:3px}
/* navbar (yer tutucu) */
.ust-bar{position:fixed;z-index:30;top:18px;left:40px;right:40px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 22px;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(10,0,40,.45)}
.ust-bar nav{display:flex;gap:28px;font-weight:500;font-size:15px}.ust-bar nav a{text-decoration:none}
@media (max-width:760px){.ust-bar{left:12px;right:12px}.ust-bar nav{display:none}}
/* sahne */
#proje-iz{position:relative}
#proje-sahne{position:sticky;top:0;height:100vh;min-height:560px;overflow:hidden;background:radial-gradient(ellipse 70% 55% at 50% 0%,#5B1E6E 0%,#2A0D45 55%,#140629 100%)}
#psahne{position:absolute;left:50%;top:0;width:1280px;height:800px;transform-origin:50% 0}
.isin{position:absolute;mix-blend-mode:screen;filter:blur(8px);pointer-events:none}
#kartlar{position:absolute;left:440px;top:300px;width:240px;height:280px}
.kart{position:absolute;left:0;top:0;width:240px;transition:transform 1.1s cubic-bezier(.22,1,.36,1),filter 1.1s ease}
.kart-ic{position:relative}
.kart-kes{background:linear-gradient(170deg,#3A1260,#1E0838)}
.kart-gorsel{height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.kart-gorsel img,#d-ana img{width:100%;height:100%;object-fit:cover;display:block}
.kart-gorsel .vt{font-size:20px}
.kart-yazi{padding:14px 22px 22px;display:flex;flex-direction:column;gap:2px}
.kart-no{font-size:18px;color:#FF9AB0;letter-spacing:2px}.kart-ad{font-size:20px;font-weight:700}
.kalem{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#disk{position:absolute;left:50%;top:50%;width:540px;height:540px;margin:-270px 0 0 -270px;transform-origin:50% 50%;transition:transform 1.1s cubic-bezier(.22,1,.36,1)}
/* panel */
.panel{position:relative;box-sizing:border-box;padding:22px 24px 24px;border-radius:6px;background:linear-gradient(180deg,rgba(20,6,41,.82),rgba(42,13,69,.82));border:2px solid rgba(127,231,255,.55);box-shadow:0 0 0 4px rgba(20,6,41,.6),0 0 28px rgba(127,231,255,.25),inset 0 0 30px rgba(127,231,255,.08);display:flex;flex-direction:column;gap:12px;overflow:hidden}
#panel{position:absolute;right:48px;top:236px;width:300px;z-index:6}
.tarama{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);animation:scan .4s linear infinite}
.pn-ust{font-size:18px;color:#7FE7FF;letter-spacing:2px}.pn-ad{font-size:28px;font-weight:700;line-height:1.05}.pn-acik{font-size:20px;line-height:1.2;color:#D9C6EC}
.pn-statlar{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.stat-ust{display:flex;justify-content:space-between;font-size:18px;color:#FFE7C2}
.segler{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin-top:3px}
.segler span{height:12px;background:rgba(255,255,255,.12);transition:background .3s ease,box-shadow .3s ease}
.segler span.dolu{background:linear-gradient(180deg,#FFE7A3,#FF5A6E);box-shadow:0 0 8px rgba(255,140,110,.55)}
.pn-sec{align-self:flex-start;margin-top:6px;padding:11px 22px;font-size:18px}
/* başlık ve kontroller (ölçeklenmez) */
.p-baslik{position:absolute;left:56px;top:104px;z-index:5;display:flex;flex-direction:column;gap:4px}
.p-baslik h1{margin:0;font-size:58px;font-weight:700;line-height:1;background:linear-gradient(180deg,#FFF6D6 10%,#FFC24B 50%,#FF5A6E 95%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #3A0B52) drop-shadow(0 0 22px rgba(255,170,80,.45))}
.p-sayac{position:absolute;right:56px;top:112px;z-index:5;text-align:right;font-size:22px;color:#E9D6FF;line-height:1.1}
#sayac{font-size:56px;color:#FFD36B;text-shadow:0 0 18px rgba(255,190,90,.6)}
.kontroller{position:absolute;left:0;right:0;bottom:26px;z-index:6;display:flex;justify-content:center;align-items:center;gap:20px}
.kontroller .pxbtn{width:52px;height:46px;font-size:20px}
#noktalar{display:flex;gap:10px}#noktalar button{width:16px;height:16px;padding:0;border:2px solid #FFE7A3;cursor:pointer;background:transparent}
#noktalar button.aktif{background:#FFC24B;box-shadow:0 0 12px rgba(255,190,90,.8)}
.ipucu{position:absolute;left:56px;bottom:34px;z-index:6;font-size:20px;color:#BFA8DA}
#panel-mobil{display:none}
@media (max-width:760px){
  #proje-sahne{position:relative;height:auto;min-height:0}
  #panel{display:none}
  .p-baslik{left:16px;top:84px}.p-baslik h1{font-size:34px}.p-baslik .vt{font-size:18px!important}
  .p-sayac{right:16px;top:90px}#sayac{font-size:34px}
  .ipucu{display:none}
  .kontroller{bottom:14px}
  #panel-mobil{display:flex;margin:0 14px 40px}
}
/* detay penceresi */
#detay-perde{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse 60% 60% at 50% 50%,rgba(20,6,41,.55),rgba(8,2,18,.92));opacity:0;transition:opacity .6s ease}
#detay-perde.acik{opacity:1}
#detay{position:fixed;left:50%;top:50%;z-index:41;width:min(1020px,92vw);height:min(640px,88vh);transform:translate(-50%,-50%) translate(-14vw,10vh) scale(.3);opacity:0;transition:transform .75s cubic-bezier(.22,1,.36,1),opacity .5s ease}
#detay.acik{transform:translate(-50%,-50%);opacity:1}
#d-kes{position:absolute;inset:0;background:linear-gradient(165deg,#3A1260,#1E0838 60%,#140629)}
.d-icerik{position:absolute;inset:0;padding:54px 60px 48px;display:flex;gap:44px;overflow:auto}
.d-sol{flex:0 0 51%;display:flex;flex-direction:column;gap:14px;min-width:0}
#d-ana{flex:1;min-height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,231,194,.25)}
#d-ana .vt{font-size:24px}
#d-kucukler{display:flex;gap:12px}
#d-kucukler button{flex:1;height:96px;padding:0;cursor:pointer;background:#1E0838;border:2px solid rgba(255,231,194,.25);opacity:.55;transition:opacity .3s,border-color .3s;overflow:hidden}
#d-kucukler button.aktif{opacity:1;border-color:#FFC24B;box-shadow:0 0 14px rgba(255,190,90,.5)}
#d-kucukler img{width:100%;height:100%;object-fit:cover;display:block}
.d-sag{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
#d-no{font-size:20px;color:#7FE7FF;letter-spacing:2px}
#d-ad{margin:0;font-size:40px;font-weight:700;line-height:1.05;background:linear-gradient(180deg,#FFF6D6 10%,#FFC24B 50%,#FF5A6E 95%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 16px rgba(255,170,80,.4))}
.d-bilgi{display:flex;gap:18px;font-size:19px;color:#FFE7C2}
#d-acik{margin:0;font-size:21px;line-height:1.25;color:#E3D2F4}
#detay .stat{display:grid;grid-template-columns:110px 1fr 46px;align-items:center;gap:10px}
#detay .stat-ust{display:contents}#detay .stat-ad{grid-column:1}#detay .stat-deger{grid-column:3;text-align:right}#detay .segler{grid-column:2;grid-row:1;margin:0}
.d-dugmeler{display:flex;gap:14px;margin-top:auto;flex-wrap:wrap}
#d-link{display:inline-block;padding:12px 22px;font-size:18px;text-decoration:none;color:#140629}
#d-kapat{padding:12px 20px;font-family:VT323,monospace;font-size:20px;cursor:pointer;color:#FFE7C2;background:transparent;border:2px solid rgba(255,231,194,.5)}
@media (max-width:760px){.d-icerik{flex-direction:column;padding:34px 26px 30px;gap:20px}.d-sol{flex:none}#d-ana{min-height:220px}#d-ad{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* footer (yer tutucu — ortak footer kullanılacak) */
.alt{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 24px 30px;background:linear-gradient(180deg,#140629,#2A0D57 40%,#140629)}
.alt p{margin:0}
</style>
</head>

    sahne.style.transform = 'translateX(calc(-50% + ' + x + 'px)) scale(' + k + ')';
    sahne.style.top = mobil() ? (150 - 130 * k) + 'px' : (h - 800 * k) + 'px';
    if (mobil()) kap.style.height = Math.round((720 - 130) * k + 150 + 70) + 'px'; else kap.style.height = '';
  }

  /* ---------- kartlar ---------- */
  var kartKap = $('kartlar'), kartlar = [];
  function kalemSvg(p) {
    return '<svg class="kalem" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><g filter="url(#pencil2)">' +
      '<path d="' + p[0] + '" fill="#F9D648"/><path d="' + p[1] + '" fill="#F9D648"/><path d="' + p[2] + '" fill="#F9D648"/><path d="' + p[3] + '" fill="#F9D648"/>' +
      '<path d="' + p[4] + '" fill="none" stroke="#FFF0A8" stroke-width=".9" stroke-opacity=".75" vector-effect="non-scaling-stroke"/>' +
      '<path d="' + p[5] + '" fill="none" stroke="#FFF0A8" stroke-width=".9" stroke-opacity=".75" vector-effect="non-scaling-stroke"/></g></svg>';
  }
  function gorselHtml(p, i) {
    var g = p.gorseller && p.gorseller[i];
    return g ? '<img src="' + esc(g) + '" alt="' + esc(p.ad) + '" loading="lazy">' : '<span class="vt">' + (p.kilitli ? 'KİLİTLİ' : '[PROJE GÖRSELİ]') + '</span>';
  }
  PROJELER.forEach(function (p, i) {
    var d = document.createElement('div');
    d.className = 'kart';
    d.innerHTML = '<div class="kart-ic"><div class="kart-kes" style="clip-path:url(#kc' + (i % 3) + ')">' +
      '<div class="kart-gorsel" style="background:' + p.renk + '">' + gorselHtml(p, 0) + '</div>' +
      '<div class="kart-yazi"><span class="vt kart-no">NUMARA_' + String(i + 1).padStart(2, '0') + '</span><span class="px kart-ad">' + esc(p.ad) + '</span></div>' +
      '</div>' + kalemSvg(KALEM[i % 3]) + '</div>';
    kartKap.appendChild(d); kartlar.push(d);
  });

  /* ---------- panel (masaüstü sağda, telefonda aşağıda) ---------- */
  var paneller = [$('panel'), $('panel-mobil')];
  paneller.forEach(function (pn) {
    pn.innerHTML = '<div class="tarama" aria-hidden="true"></div>' +
      '<span class="vt pn-ust"></span><span class="px pn-ad"></span><span class="vt pn-acik"></span>' +
      '<div class="pn-statlar">' + [0, 1, 2].map(function () {
        return '<div class="stat"><div class="vt stat-ust"><span class="stat-ad"></span><span class="stat-deger"></span></div><div class="segler">' +
          '<span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>';
      }).join('') + '</div>' +
      '<button class="pxbtn pn-sec" type="button">SEÇ ▶</button>';
    pn.querySelector('.pn-sec').addEventListener('click', function () { ac(act, this); });
  });
  function statDoldur(kok, araclar) {
    var st = kok.querySelectorAll('.stat');
    st.forEach(function (s, si) {
      var a = araclar[si];
      s.style.display = a ? '' : 'none';
      if (!a) return;
      s.querySelector('.stat-ad').textContent = a[0];
      s.querySelector('.stat-deger').textContent = a[1] + '/10';
      s.querySelectorAll('.segler span').forEach(function (g, k) {
        g.style.transitionDelay = (si * 0.12 + k * 0.04).toFixed(2) + 's';
        g.classList.toggle('dolu', k < a[1]);
      });
    });
  }
  function panelCiz() {
    var p = PROJELER[act];
    paneller.forEach(function (pn) {
      pn.querySelector('.pn-ust').textContent = 'OYUNCU 1 · NUMARA_' + String(act + 1).padStart(2, '0');
      pn.querySelector('.pn-ad').textContent = p.ad;
      pn.querySelector('.pn-acik').textContent = p.kisa || '';
      statDoldur(pn, p.araclar || []);
      var b = pn.querySelector('.pn-sec');
      b.textContent = p.kilitli ? 'KİLİTLİ' : 'SEÇ ▶'; b.disabled = !!p.kilitli;
    });
  }

  /* ---------- yörünge yerleşimi ---------- */
  var disk = $('disk'), sayac = $('sayac'), noktalar = $('noktalar');
  noktalar.innerHTML = PROJELER.map(function (p, i) { return '<button type="button" aria-label="Proje ' + (i + 1) + '"></button>'; }).join('');
  var noktaBtn = [].slice.call(noktalar.children);
  noktaBtn.forEach(function (b, i) { b.addEventListener('click', function () { git(i); }); });
  function yerlestir() {
    var step = 2 * Math.PI / N;
    kartlar.forEach(function (k, i) {
      var th = (i - act) * step, x = Math.sin(th) * 265, derin = Math.cos(th);
      var sc = 0.55 + 0.45 * (derin + 1) / 2, y = (1 - derin) * -46;
      k.style.zIndex = Math.round((derin + 1) * 10);
      k.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + sc.toFixed(3) + ')';
      k.style.filter = derin > 0.95 ? 'drop-shadow(0 0 24px rgba(255,200,90,.45)) drop-shadow(0 26px 30px rgba(5,0,20,.7))'
        : 'brightness(' + (0.35 + 0.35 * (derin + 1) / 2).toFixed(2) + ') saturate(.7) blur(' + (derin < -0.5 ? 2 : 0.6) + 'px)';
      k.setAttribute('aria-hidden', i === act ? 'false' : 'true');
    });
    disk.style.transform = 'scaleY(.18) rotate(' + (-act * 360 / N) + 'deg)';
    sayac.textContent = String(act + 1).padStart(2, '0') + '/' + String(N).padStart(2, '0');
    noktaBtn.forEach(function (b, i) { b.classList.toggle('aktif', i === act); });
    $('onceki').disabled = act === 0; $('sonraki').disabled = act === N - 1;
    panelCiz();
  }
  function secAct(i) { i = Math.max(0, Math.min(N - 1, i)); if (i === act) return; act = i; yerlestir(); }

  /* ---------- kaydırma: bölüm sabit, her proje ~1 ekran kaydırma ---------- */
  function kaydir() {
    if (mobil()) return;
    var toplam = iz.offsetHeight - innerHeight;
    var p = toplam > 0 ? Math.min(1, Math.max(0, (scrollY - iz.offsetTop) / toplam)) : 0;
    secAct(Math.round(p * (N - 1)));
  }
  function git(i) {
    i = Math.max(0, Math.min(N - 1, i));
    if (mobil()) { secAct(i); return; }
    var toplam = iz.offsetHeight - innerHeight;
    scrollTo({ top: iz.offsetTop + (N > 1 ? i / (N - 1) : 0) * toplam, behavior: azHareket ? 'auto' : 'smooth' });
  }
  $('onceki').addEventListener('click', function () { git(act - 1); });
  $('sonraki').addEventListener('click', function () { git(act + 1); });
  addEventListener('keydown', function (e) {
    if (acik) { if (e.key === 'Escape') kapat(); return; }
    var r = kap.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); git(act + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); git(act - 1); }
  });
  // telefonda sola-sağa kaydırma
  var tx = null;
  kap.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  kap.addEventListener('touchend', function (e) {
    if (tx === null || !mobil()) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 40) secAct(act + (dx < 0 ? 1 : -1));
  });

  /* ---------- detay penceresi ---------- */
  var perde = $('detay-perde'), detay = $('detay'), acik = false, geriOdak = null, gi = 0;
  function detayGorsel() {
    var p = PROJELER[act], gs = p.gorseller || [];
    $('d-ana').style.background = p.renk;
    $('d-ana').innerHTML = gorselHtml(p, gi);
    var th = $('d-kucukler');
    th.style.display = gs.length > 1 ? '' : 'none';
    th.innerHTML = gs.length > 1 ? gs.map(function (g, i) {
      return '<button type="button" class="' + (i === gi ? 'aktif' : '') + '" aria-label="Görsel ' + (i + 1) + '"><img src="' + esc(g) + '" alt=""></button>';
    }).join('') : '';
    [].forEach.call(th.children, function (b, i) { b.addEventListener('click', function () { gi = i; detayGorsel(); }); });
  }
  function ac(i, kaynak) {
    var p = PROJELER[i]; if (p.kilitli) return;
    gi = 0; geriOdak = kaynak || null;
    $('d-no').textContent = 'NUMARA_' + String(i + 1).padStart(2, '0') + ' · PROFİL';
    $('d-ad').textContent = p.ad;
    $('d-rol').textContent = p.rol ? 'ROL: ' + p.rol : ''; $('d-rol').style.display = p.rol ? '' : 'none';
    $('d-yil').textContent = p.yil ? 'TARİH: ' + p.yil : ''; $('d-yil').style.display = p.yil ? '' : 'none';
    $('d-acik').textContent = p.uzun || p.kisa || '';
    statDoldur(detay, p.araclar || []);
    var l = $('d-link'); l.style.display = p.link ? '' : 'none'; if (p.link) l.href = p.link;
    $('d-kalem').innerHTML = kalemSvg(KALEM[i % 3]).replace(/^<svg class="kalem"/, '<svg class="kalem"');
    $('d-kes').style.clipPath = 'url(#kc' + (i % 3) + ')';
    detayGorsel();
    acik = true; document.body.classList.add('detay-acik');
    detay.removeAttribute('hidden'); perde.removeAttribute('hidden');
    requestAnimationFrame(function () { detay.classList.add('acik'); perde.classList.add('acik'); $('d-kapat').focus(); });
  }
  function kapat() {
    if (!acik) return;
    acik = false; detay.classList.remove('acik'); perde.classList.remove('acik'); document.body.classList.remove('detay-acik');
    setTimeout(function () { if (!acik) { detay.setAttribute('hidden', ''); perde.setAttribute('hidden', ''); } }, 700);
    if (geriOdak) geriOdak.focus();
  }
  $('d-kapat').addEventListener('click', kapat);
  perde.addEventListener('click', kapat);

  /* ---------- başlat ---------- */
  function hepsi() { olc(); kaydir(); }
  addEventListener('resize', hepsi);
  addEventListener('scroll', kaydir, { passive: true });
  olc(); yerlestir(); kaydir();
})();
</script>
</body>
</html>
