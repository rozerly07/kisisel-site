html{background:#140629}

.bilet span{opacity:.7}
.bilet[aria-pressed=true],.bilet.altin{background:linear-gradient(90deg,#FFC24B,#FF8A3D);color:#2A0D45;transform:rotate(-2deg) scale(1.06)}
.etk{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
.ust-bar{position:fixed;z-index:30;top:18px;left:40px;right:40px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 22px;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(10,0,40,.45)}
.ust-bar nav{display:flex;gap:28px;font-weight:500;font-size:15px}.ust-bar a{color:#FFF3DD;text-decoration:none}
@media (max-width:760px){.ust-bar{left:12px;right:12px}.ust-bar nav{display:none}}
.sahne-bg{position:relative;overflow:hidden;background:radial-gradient(ellipse 80% 30% at 50% 0%,#5B1E6E 0%,#2A0D45 50%,#140629 100%)}
.isin{position:absolute;top:280px;width:160px;height:1500px;transform-origin:50% 100%;clip-path:polygon(45% 100%,55% 100%,100% 0,0 0);mix-blend-mode:screen;filter:blur(8px);pointer-events:none}
.alt{min-height:320px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#2A0D57,#140629)}
@media (prefers-reduced-motion:reduce){.sahne-bg *{animation:none!important;transition:none!important}}
@keyframes salla{0%,100%{transform:rotate(var(--r))}50%{transform:rotate(calc(var(--r) + .6deg))}}
.b-ic{position:relative;max-width:1180px;margin:0 auto;padding:200px 32px 90px;display:flex;flex-direction:column;align-items:center;gap:22px}
.b-ic h1{margin:0;font-size:96px;line-height:1}
.b-ic>p{margin:0;max-width:540px;text-align:center;font-size:17px;line-height:1.6;color:#E3D2F4}
#filtreler{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:18px 0 0}
#sonuc{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pano{position:relative;width:100%;margin-top:10px;padding:70px 50px 80px;box-sizing:border-box;border-radius:26px;background:radial-gradient(ellipse at 50% 0%,rgba(255,214,130,.12),transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 46px),linear-gradient(180deg,#3A1260,#22093D);border:1px solid rgba(255,231,194,.22);box-shadow:inset 0 0 80px rgba(0,0,0,.45),0 30px 70px rgba(5,0,20,.5)}
.pano-ampul{position:absolute;left:30px;right:30px;top:18px;display:flex;justify-content:space-between}
.pano-ampul span{width:9px;height:9px;border-radius:50%;background:#FFE7A3;box-shadow:0 0 10px 3px #FFB84D;animation-name:flick;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
#afisler{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:46px;align-items:start}
.afis{position:relative;display:block;text-decoration:none;color:#2A0D45;transition:transform .7s cubic-bezier(.22,1,.36,1),opacity .6s,filter .6s}
.afis-salla{position:relative;transform:rotate(var(--r));transform-origin:50% 0;transition:transform .7s cubic-bezier(.22,1,.36,1);animation:salla 6s ease-in-out infinite;animation-delay:var(--gecikme)}

.kagit{position:relative;overflow:hidden;padding:28px 28px 26px;background:linear-gradient(170deg,#FFF7E8,#F3DFC0);box-shadow:0 14px 30px rgba(5,0,20,.5);clip-path:polygon(0 0,100% 0,100% 100%,100% 100%,0 100%);transition:clip-path .6s,box-shadow .6s}
.kapak{height:170px;margin:-28px -28px 20px;overflow:hidden}.kapak img{width:100%;height:100%;object-fit:cover;display:block}
.damga{position:absolute;right:18px;top:150px;padding:6px 12px;border:3px solid;font-family:Bungee,Impact,sans-serif;font-size:13px;letter-spacing:2px;transform:rotate(-8deg);background:rgba(255,247,232,.85);opacity:.92}
.meta{display:block;font-family:VT323,monospace;font-size:19px;color:#8A3A6A;letter-spacing:1px}
.afis-baslik{display:block;font-family:"Abril Fatface",Georgia,serif;font-size:28px;line-height:1.1;margin:6px 0 10px}
.ozet{display:block;font-family:Lora,Georgia,serif;font-size:16px;line-height:1.55;color:#4A2A55}
.etiketler{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.kagit .etk{background:rgba(198,48,110,.1);color:#9C1F57;border:1px solid rgba(198,48,110,.3)}
.oku{display:inline-block;margin-top:18px;font-family:Bungee,Impact,sans-serif;font-size:13px;letter-spacing:2px;color:#C6306E}
.kivrim{position:absolute;right:0;bottom:0;width:0;height:0;background:linear-gradient(135deg,#E2C79C 0%,#F6E6C8 48%,rgba(0,0,0,.25) 50%,transparent 52%);transition:width .6s,height .6s}
.afis:hover,.afis:focus-visible{transform:translateY(-10px) scale(1.03)}
.afis:hover .afis-salla,.afis:focus-visible .afis-salla{animation:none;transform:rotate(0deg)}
.afis:hover .kagit,.afis:focus-visible .kagit{clip-path:polygon(0 0,100% 0,100% calc(100% - 46px),calc(100% - 46px) 100%,0 100%);box-shadow:0 30px 50px rgba(5,0,20,.65),0 0 30px rgba(255,190,110,.25)}
.afis:hover .kivrim,.afis:focus-visible .kivrim{width:46px;height:46px}

.afis.sonuk .afis-salla{animation:none}

<script>
/* Blog yazılarının listesi (ICERIK.md'den). Blog panosu ve yazı sayfalarındaki önceki/sonraki biletleri bu listeyi kullanır.
   renk: kategori damgasının rengi (aynı kategoriye aynı renk). sure: dakika (yazı uzunluğuna göre). */
window.YAZILAR = [
  { dosya: 'blog-1.html', baslik: '[1. yazının başlığı]', ozet: '[İki cümlelik özet.]', kategori: '[KATEGORİ A]', renk: '#C6306E', tarih: '[GG.AA.YYYY]', sure: 4, etiketler: ['etiket1', 'etiket2', 'etiket3'], kapak: '', yedek: 'linear-gradient(150deg,#2A0D57,#C6306E 70%,#FF8A3D)' },
  { dosya: 'blog-2.html', baslik: '[2. yazının başlığı]', ozet: '[İki cümlelik özet.]', kategori: '[KATEGORİ B]', renk: '#2340C8', tarih: '[GG.AA.YYYY]', sure: 6, etiketler: ['etiket2', 'etiket4'], kapak: '', yedek: 'linear-gradient(150deg,#0E3A6E,#6A1B7A 60%,#FF5A8A)' },
  { dosya: 'blog-3.html', baslik: '[3. yazının başlığı]', ozet: '[İki cümlelik özet.]', kategori: '[KATEGORİ A]', renk: '#C6306E', tarih: '[GG.AA.YYYY]', sure: 3, etiketler: ['etiket1', 'etiket5'], kapak: '', yedek: 'linear-gradient(150deg,#6A1B7A,#FF8A3D 70%,#FFC66B)' }
];
</script>
<script>
(function () {
  var Y = window.YAZILAR || [], $ = function (id) { return document.getElementById(id); };
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var R = ['-2.2deg', '1.6deg', '-1deg'], B = ['-4deg', '3deg', '-2deg'];

  /* afişler */
  var pano = $('afisler');
  pano.innerHTML = Y.map(function (y, i) {
    var kapak = y.kapak ? '<img src="' + esc(y.kapak) + '" alt="" loading="lazy">' : '';
    return '<a href="' + esc(y.dosya) + '" class="afis" data-kat="' + esc(y.kategori) + '" style="--r:' + R[i % 3] + ';--gecikme:' + (-i * 2) + 's">' +
      '<div class="afis-salla"><span class="bant" style="transform:translateX(-50%) rotate(' + B[i % 3] + ')" aria-hidden="true"></span>' +
      '<div class="kagit"><div class="kapak" style="background:' + y.yedek + '">' + kapak + '</div>' +
      '<span class="damga" style="border-color:' + y.renk + ';color:' + y.renk + '">' + esc(y.kategori) + '</span>' +
      '<span class="meta">' + esc(y.tarih) + ' · ' + y.sure + ' dk</span>' +
      '<span class="afis-baslik">' + esc(y.baslik) + '</span>' +
      '<span class="ozet">' + esc(y.ozet) + '</span>' +
      '<span class="etiketler">' + y.etiketler.map(function (e) { return '<span class="etk">#' + esc(e) + '</span>'; }).join('') + '</span>' +
      '<span class="oku">OKU →</span><span class="kivrim" aria-hidden="true"></span></div></div></a>';
  }).join('');
  var afisler = [].slice.call(pano.children);

  /* kategori filtreleri (bilet) */
  var kats = ['TÜMÜ'];
  Y.forEach(function (y) { if (kats.indexOf(y.kategori) < 0) kats.push(y.kategori); });
  var fk = $('filtreler');
  fk.innerHTML = kats.map(function (k) {
    var n = k === 'TÜMÜ' ? Y.length : Y.filter(function (y) { return y.kategori === k; }).length;
    return '<button type="button" class="bilet" aria-pressed="false" data-kat="' + esc(k) + '">' + esc(k) + ' <span>· ' + n + '</span></button>';
  }).join('');
  var btn = [].slice.call(fk.children);
  function sec(k) {
    btn.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.kat === k ? 'true' : 'false'); });
    afisler.forEach(function (a) {
      var gor = k === 'TÜMÜ' || a.dataset.kat === k;
      a.classList.toggle('sonuk', !gor);
      a.setAttribute('aria-hidden', gor ? 'false' : 'true');
      a.tabIndex = gor ? 0 : -1;
    });
    $('sonuc').textContent = k === 'TÜMÜ' ? Y.length + ' yazı gösteriliyor' : k + ': ' + afisler.filter(function (a) { return !a.classList.contains('sonuk'); }).length + ' yazı';
    try { history.replaceState(null, '', k === 'TÜMÜ' ? location.pathname : '?kategori=' + encodeURIComponent(k)); } catch (e) {}
  }
  btn.forEach(function (b) { b.addEventListener('click', function () { sec(b.dataset.kat); }); });
  var q = new URLSearchParams(location.search).get('kategori');
  sec(q && kats.indexOf(q) > -1 ? q : 'TÜMÜ');
})();
</script>
